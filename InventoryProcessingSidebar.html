<!doctype html>
<html>
	<head>
		<base target="_top" />
		<?!= include('Styles'); ?>
	</head>
	<body>
		<div class="header"><h2>Painting & Packing</h2></div>
		<div class="section">
			<div class="section-title">Paint product</div>
			<label>Date</label><input type="date" id="paintingDate" />
			<label style="margin-top:10px">Product</label><select id="paintingProduct"></select>
			<label style="margin-top:10px">Quantity (pieces)</label><input type="number" min="1" id="paintingQuantity" />
			<label style="margin-top:10px">Remarks</label><textarea id="paintingRemarks" rows="2"></textarea>
			<div class="button-container"><button class="primary-btn" id="savePainting">Post Painting</button></div>
		</div>
		<hr />
		<div class="section">
			<div class="section-title">Pack product or bundle</div>
			<label>Date</label><input type="date" id="packingDate" />
			<label style="margin-top:10px">Packed SKU</label><select id="packingProduct"></select>
			<label style="margin-top:10px">Boxes</label><input type="number" min="1" id="packingBoxes" />
			<label style="margin-top:10px">Remarks</label><textarea id="packingRemarks" rows="2"></textarea>
			<div class="button-container"><button class="primary-btn" id="savePacking">Post Packing</button></div>
		</div>
		<hr />
		<div class="section">
			<div class="section-title">Sellable availability</div>
			<div id="availability" class="empty">Loading…</div>
		</div>
		<script>
			let inventoryProducts = [];
			document.addEventListener('DOMContentLoaded', init);
			function init() {
				document.getElementById('paintingDate').valueAsDate = new Date();
				document.getElementById('packingDate').valueAsDate = new Date();
				document.getElementById('savePainting').addEventListener('click', savePainting);
				document.getElementById('savePacking').addEventListener('click', savePacking);
				loadData();
			}
			function loadData() { google.script.run.withSuccessHandler(populate).withFailureHandler(showError).getPackingFormData(); }
			function populate(data) {
				inventoryProducts = data.products;
				const painting = document.getElementById('paintingProduct');
				const packing = document.getElementById('packingProduct');
				painting.innerHTML = '<option value="">Select painted product</option>';
				packing.innerHTML = '<option value="">Select packed SKU</option>';
				inventoryProducts.forEach((product) => {
					if (product.productType.toLowerCase() !== 'bundle' && product.requiresPainting) addOption(painting, product);
					addOption(packing, product);
				});
				renderAvailability(data.availability);
			}
			function addOption(select, product) { const option = document.createElement('option'); option.value = product.id; option.textContent = product.name + (product.productType.toLowerCase() === 'bundle' ? ' (Bundle)' : ''); select.appendChild(option); }
			function renderAvailability(items) {
				if (!items.length) { document.getElementById('availability').textContent = 'No active products.'; return; }
				document.getElementById('availability').innerHTML = '<table><thead><tr><th>SKU</th><th>Packed</th><th>Can pack</th><th>Total</th></tr></thead><tbody>' + items.map((item) => '<tr><td>' + escapeHtml(item.productName) + '</td><td>' + item.packed + '</td><td>' + item.canPackNow + '</td><td>' + item.canFulfilAfterPacking + '</td></tr>').join('') + '</tbody></table>';
			}
			function savePainting() {
				const productId = document.getElementById('paintingProduct').value;
				const quantity = Number(document.getElementById('paintingQuantity').value);
				if (!productId || quantity <= 0) return alert('Select a product and enter a positive quantity.');
				google.script.run.withSuccessHandler(done).withFailureHandler(showError).postPainting({ date: document.getElementById('paintingDate').value, productId, quantity, remarks: document.getElementById('paintingRemarks').value.trim() });
			}
			function savePacking() {
				const productId = document.getElementById('packingProduct').value;
				const boxes = Number(document.getElementById('packingBoxes').value);
				if (!productId || boxes <= 0) return alert('Select a SKU and enter a positive box quantity.');
				google.script.run.withSuccessHandler(done).withFailureHandler(showError).postPacking({ date: document.getElementById('packingDate').value, productId, boxes, remarks: document.getElementById('packingRemarks').value.trim() });
			}
			function done(result) { alert('Saved successfully. Reference: ' + result.referenceId); document.getElementById('paintingQuantity').value = ''; document.getElementById('packingBoxes').value = ''; loadData(); }
			function showError(error) { alert(error.message || error); }
			function escapeHtml(value) { const div = document.createElement('div'); div.textContent = value; return div.innerHTML; }
		</script>
	</body>
</html>
