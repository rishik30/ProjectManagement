<script>
	let products = [];

	document.addEventListener('DOMContentLoaded', initializeInventoryForm);

	function initializeInventoryForm() {
		document
			.getElementById('inventoryTransactionType')
			.addEventListener('change', updateFormForTransaction);
		loadProducts();
		clearInventoryForm();
	}

	function loadProducts() {
		google.script.run
			.withSuccessHandler((data) => {
				products = data.products;
				updateFormForTransaction();
			})
			.withFailureHandler(showError)
			.getInventoryProductFormData();
	}

	function updateFormForTransaction() {
		const type = document.getElementById('inventoryTransactionType').value;
		const stageSection = document
			.getElementById('stockAdjustmentStage')
			.closest('.section');
		const dropdown = document.getElementById('stockAdjustmentProduct');

		stageSection.style.display =
			type === 'Adjustment' || type === 'Allocation' ? 'block' : 'none';
		stageSection.querySelector('label').textContent =
			type === 'Allocation' ? 'Allocate To Stage' : 'Stock Stage';
		document.getElementById('inventoryQuantityLabel').textContent =
			type === 'Packing' ? 'Boxes' : 'Quantity (pieces)';

		const availableProducts = products.filter((product) => {
			if (type === 'Painting') {
				return (
					String(product.productType).toLowerCase() !== 'bundle' &&
					product.requiresPainting
				);
			}
			return true;
		});

		dropdown.innerHTML = '<option value="">Select Product</option>';
		availableProducts.forEach((product) => {
			const option = document.createElement('option');
			option.value = product.id;
			option.textContent =
				product.name +
				(String(product.productType).toLowerCase() === 'bundle'
					? ' (Bundle)'
					: '');
			dropdown.appendChild(option);
		});
	}

	function clearInventoryForm() {
		document.getElementById('stockAdjustmentDate').valueAsDate = new Date();
		document.getElementById('inventoryTransactionType').value = 'Allocation';
		document.getElementById('stockAdjustmentQuantity').value = '';
		document.getElementById('stockAdjustmentRemarks').value = '';
		document.getElementById('stockAdjustmentStage').value = 'Packed';
		updateFormForTransaction();
	}

	function cancelAdjustment() {
		clearInventoryForm();
	}

	function collectFormData() {
		const productSelect = document.getElementById('stockAdjustmentProduct');
		return {
			type: document.getElementById('inventoryTransactionType').value,
			date: document.getElementById('stockAdjustmentDate').value,
			productId: productSelect.value,
			productName: productSelect.selectedOptions[0]?.text || '',
			stage: document.getElementById('stockAdjustmentStage').value,
			quantity: Number(document.getElementById('stockAdjustmentQuantity').value),
			remarks: document.getElementById('stockAdjustmentRemarks').value.trim(),
		};
	}

	function saveAdjustment() {
		const button = document.getElementById('btnSaveAdjustment');
		if (button.disabled) return;

		try {
			const data = collectFormData();
			if (!data.date || !data.productId || !data.quantity) {
				throw new Error('Date, product, and a non-zero quantity are required.');
			}
			if (data.type !== 'Adjustment' && data.quantity <= 0) {
				throw new Error('Painting and packing quantities must be positive.');
			}

			button.disabled = true;
			button.textContent = 'Saving...';
			const request = google.script.run
				.withSuccessHandler(onSaved)
				.withFailureHandler(showError);

			if (data.type === 'Allocation') {
				request.postStageAllocation(data);
			} else if (data.type === 'Painting') {
				request.postPainting(data);
			} else if (data.type === 'Packing') {
				request.postPacking({
					date: data.date,
					productId: data.productId,
					boxes: data.quantity,
					remarks: data.remarks,
				});
			} else {
				request.postStockAdjustment(data);
			}
		} catch (error) {
			showError(error);
		}
	}

	function onSaved(result) {
		const button = document.getElementById('btnSaveAdjustment');
		button.disabled = false;
		button.textContent = 'Save';
		alert('Inventory movement saved' + (result.referenceId ? '. Reference: ' + result.referenceId : '.') );
		clearInventoryForm();
	}

	function showError(error) {
		const button = document.getElementById('btnSaveAdjustment');
		button.disabled = false;
		button.textContent = 'Save';
		alert(error.message || error);
	}
</script>
